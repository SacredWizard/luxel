[workspace]
resolver = "3"
members = ["crates/luxel-core", "crates/luxel-gpu", "crates/luxel-finance", "crates/luxel-egui", "examples/luxel-demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SacredWizard/luxel"

[profile.release]
debug = false
lto = "thin"

[workspace.lints.clippy]
# `!(x > y)` is deliberate: it is true for NaN, which `x <= y` is not.
neg_cmp_op_on_partial_ord = "allow"
# `Rgba::rgba(..)` reads naturally next to `Rgba::rgb(..)`.
self_named_constructors = "allow"
