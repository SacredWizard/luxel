[package]
name = "luxel-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
luxel-core = { path = "../../crates/luxel-core" }
luxel-finance = { path = "../../crates/luxel-finance" }
luxel-egui = { path = "../../crates/luxel-egui" }
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console", "Performance", "Location"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
