[package]
name = "photic-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
photic-core = { path = "../../crates/photic-core" }
photic-gpu = { path = "../../crates/photic-gpu" }
photic-finance = { path = "../../crates/photic-finance" }
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
egui-wgpu = "0.35"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console", "Performance"] }
wasm-bindgen = "0.2"
